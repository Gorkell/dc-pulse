name: SQLite and PostgreSQL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  SIMULATOR_ENABLED: '0'
jobs:
  sqlite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node tests/frontend.cjs
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iot_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://test:disposable-ci-only@localhost:5432/iot_test
          ALLOW_TEST_DATABASE_RESET: '1'
